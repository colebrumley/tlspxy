run:
  timeout: 5m
  go: "1.24"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - gocritic

linters-settings:
  gocritic:
    disabled-checks:
      # main() fails closed via os.Exit after `defer rootCancel()`; the defer
      # exists to satisfy govet's lostcancel and is moot on exit paths.
      - exitAfterDefer
