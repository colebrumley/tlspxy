#tlspxy — AWS SigV4 credential-translation gateway
#
# Clients sign requests with tlspxy-issued SigV4 access keys. tlspxy fully
# verifies each inbound signature, maps the verified access key to an outbound
# AWS role, re-signs the request with real AWS credentials, and forwards it to
# the AWS endpoint. One audit line is emitted per request.
#
# SigV4 gateway mode is HTTP/HTTPS only.

server:
  addr: ":8443"
  type: https
  tls:
    cert: /etc/tlspxy/server.crt
    key: /etc/tlspxy/server.key
  timeouts:
    read: 30s
    write: 30s

# remote.addr is still required by config validation, but in SigV4 gateway mode
# the actual upstream is determined by sigv4.endpoint / sigv4.service+region
# (and, if enabled, the inbound Host header). Point it at the default target.
remote:
  addr: "https://s3.us-east-1.amazonaws.com"

sigv4:
  # Turn on the SigV4 gateway.
  enable: true
  # Client keystore: access-key-id -> secret + mapped outbound role.
  # Hot-reloadable via SIGHUP, and automatically when autoreload is true.
  keystore: /etc/tlspxy/sigv4-keystore.yml
  autoreload: true
  # Default target service/region. Used when Host override is off or the inbound
  # Host is not an AWS endpoint.
  service: s3
  region: us-east-1
  # Optional explicit endpoint. Empty => https://<service>.<region>.amazonaws.com.
  endpoint: ""
  # Allow the inbound Host header (e.g. dynamodb.eu-west-1.amazonaws.com) to
  # override the default service/region per request.
  hostoverride: true
  # Reject inbound signatures whose date is outside this skew window.
  clockskew: 5m
  # Maximum inbound body size buffered for verification/re-signing (bytes).
  maxbodysize: 10485760
  # Outbound base credential source: static | default | webidentity.
  # Clients whose keystore entry has a role_arn additionally assume that role
  # via STS (cached and refreshed before expiry) on top of this base source.
  creds:
    source: default
    # For source: static
    # accesskey: AKIA...
    # secretkey: ...
    # sessiontoken: ""
    # For source: webidentity
    # tokenfile: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
    # rolearn: arn:aws:iam::111111111111:role/tlspxy-base
    sessionname: tlspxy

# Example keystore file (/etc/tlspxy/sigv4-keystore.yml):
#
#   keys:
#     AKIACLIENTONE:
#       secret: "client-one-shared-secret"
#       role_arn: "arn:aws:iam::111111111111:role/client-one"
#     AKIACLIENTTWO:
#       secret: "client-two-shared-secret"
#       role_arn: "arn:aws:iam::222222222222:role/client-two"
#       external_id: "optional-external-id"
#       session_name: "optional-session-name"
