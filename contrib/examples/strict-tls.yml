#tlspxy — Hardened TLS 1.3 only
#
# Restricts both server and remote connections to TLS 1.3.
# This provides the strongest encryption but requires all
# clients and backends to support TLS 1.3.

server:
  addr: ":8443"
  type: tcp
  tls:
    cert: /etc/tlspxy/server.crt
    key: /etc/tlspxy/server.key
    # Restrict to TLS 1.3 only
    minversion: "1.3"
    maxversion: "1.3"
    # Note: cipher suites are not configurable in TLS 1.3 —
    # Go uses the mandatory TLS 1.3 cipher suites automatically.

remote:
  addr: "backend.internal:8080"
  tls:
    enable: true
    verify: true
    sysroots: true
    # Also restrict backend connections to TLS 1.3
    minversion: "1.3"
    maxversion: "1.3"

log:
  level: info
